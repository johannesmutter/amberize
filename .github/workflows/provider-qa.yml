name: Provider integration QA

on:
  push:
    branches: [codex/pre-release-qa-20260930]
    paths:
      - .github/workflows/provider-qa.yml
      - scripts/provider_sync_qa.py
      - scripts/provider_sync_driver.rs

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Install TLS and secret-service build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libdbus-1-dev pkg-config
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Export the exact candidate and add only a test driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'v0.2.4-8^{}')" = b455497f7a2ffed210008a5dd6375b7cf67cedc4
          mkdir "$RUNNER_TEMP/amberize-provider-source"
          git archive v0.2.4-8 | tar -x -C "$RUNNER_TEMP/amberize-provider-source"
          cp scripts/provider_sync_driver.rs "$RUNNER_TEMP/amberize-provider-source/crates/adapters/examples/provider_sync_qa.rs"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --manifest-path "$RUNNER_TEMP/amberize-provider-source/Cargo.toml" -p email_archiver_adapters --example provider_sync_qa --release --locked
      - name: Test trusted TLS, interruptions, oversized mail, UID changes, stalls and reconnect
        run: python3 scripts/provider_sync_qa.py --driver "$GITHUB_WORKSPACE/target/release/examples/provider_sync_qa" --root "$RUNNER_TEMP/amberize-provider-evidence"
      - name: Upload synthetic integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-integration
          path: |
            ${{ runner.temp }}/amberize-provider-evidence/*.json
            ${{ runner.temp }}/amberize-provider-evidence/*-memory.txt
          if-no-files-found: warn
