name: Exact Linux package QA

on:
  push:
    branches: [codex/release-0.2.5]
    paths: [.github/workflows/appimage-qa.yml, scripts/extract_appimage.py]

# Access to the unpublished draft is required; this job never modifies a release.
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Download and verify the exact unpublished packages
        run: |
          mkdir -p "$RUNNER_TEMP/amberize-qa/packages"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          tag = 'v0.2.5'
          commit = 'dca6308729a4f6e0922b8ee14c90b6994dcf34cc'
          assert subprocess.check_output(['git','rev-parse',tag],text=True).strip() == commit
          subprocess.run(['git','diff','--exit-code',commit,'--','crates','apps/desktop/src','apps/desktop/src-tauri/src'],check=True)
          metadata = json.loads(subprocess.check_output(['gh','release','view',tag,'--json','isDraft,targetCommitish,assets'],text=True))
          assert metadata['isDraft'] and metadata['targetCommitish'] == commit
          root = Path(os.environ['RUNNER_TEMP']) / 'amberize-qa'
          expected = {'Amberize_0.2.5_amd64.AppImage':'5c85dd297ebb424625c6743a14e32797b70118bdefc9deb0c85c5f7078814bf4',
                      'Amberize_0.2.5_amd64.deb':'1ca538007a3d5df1128f7710ba5b76a09c4c482c6b67e6e7552fc1d2c63036ca'}
          for name,digest in expected.items():
              subprocess.run(['gh','release','download',tag,'--pattern',name,'--dir',str(root/'packages')],check=True)
              assert hashlib.sha256((root/'packages'/name).read_bytes()).hexdigest() == digest
          (root/'packages.json').write_text(json.dumps({'tag':tag,'release_commit':commit,'assets':expected},indent=2))
          build = json.loads(subprocess.check_output(['gh','run','view','36930551203','--json','headSha'],text=True))
          assert build['headSha'] == commit
          subprocess.run(['gh','run','download','36930551203','--name','native-qa-aarch64-apple-darwin','--dir',str(root/'seed')],check=True)
          PY
      - name: Install extraction and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xvfb strace
          chmod +x "$RUNNER_TEMP/amberize-qa/packages/Amberize_0.2.5_amd64.AppImage"
      - name: Check the stored modes and library requirements
        run: |
          python3 scripts/extract_appimage.py "$RUNNER_TEMP/amberize-qa/packages/Amberize_0.2.5_amd64.AppImage" "$RUNNER_TEMP/amberize-appimage"
          python3 scripts/verify_appimage_permissions.py "$RUNNER_TEMP/amberize-appimage" --max-glibc 2.35 > "$RUNNER_TEMP/amberize-qa/appimage-permissions.json"
      - name: Install fixture toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
      - name: Exercise the Debian and AppImage packages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sqlite3
          from contextlib import closing
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'amberize-qa'
          seed = json.loads((root/'seed/native.json').read_text())
          assert seed['passed'] and seed['counts']['message_blobs'] == 1024
          assert not (root/'archive.sqlite3').exists()
          with closing(sqlite3.connect(root/'seed/archive.sqlite3')) as source, closing(sqlite3.connect(root/'archive.sqlite3')) as destination:
              source.backup(destination)
          PY
          cargo run -p email_archiver_storage --release --example qa_fixture --locked -- verify "$RUNNER_TEMP/amberize-qa/archive.sqlite3" > "$RUNNER_TEMP/amberize-qa/before.json"
          sudo apt-get install -y "$RUNNER_TEMP/amberize-qa/packages/Amberize_0.2.5_amd64.deb"
          mkdir -m 700 "$RUNNER_TEMP/amberize-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/amberize-runtime"
          binary=$(command -v Amberize || command -v amberize)
          xvfb-run -a dbus-run-session -- python3 scripts/native_release_smoke.py --binary "$binary" --fixture "$RUNNER_TEMP/amberize-qa/archive.sqlite3" --config-dir "$RUNNER_TEMP/deb-profile/com.amberize.app" --report "$RUNNER_TEMP/amberize-qa/native.json"
          cargo run -p email_archiver_storage --release --example qa_fixture --locked -- verify "$RUNNER_TEMP/amberize-qa/archive.sqlite3" > "$RUNNER_TEMP/amberize-qa/after.json"
      - name: Execute the root-owned package as a separate user
        run: |
          set -euo pipefail
          qa_root=$(mktemp -d /tmp/amberize-appimage-user-XXXXXX)
          preserve_and_clean() {
            for suffix in json log trace; do
              if [ -f "$qa_root/home/unrelated-user.$suffix" ]; then
                cp "$qa_root/home/unrelated-user.$suffix" "$RUNNER_TEMP/amberize-qa/appimage-unrelated-user.$suffix"
              fi
            done
            sudo rm -rf "$qa_root"
          }
          trap preserve_and_clean EXIT
          chmod 755 "$qa_root"
          cp -a "$RUNNER_TEMP/amberize-appimage" "$qa_root/app"
          sudo chown -hR root:root "$qa_root/app"
          mkdir "$qa_root/home"
          sudo useradd --no-create-home --home-dir "$qa_root/home" --shell /bin/bash amberize-qa-user
          mkdir -m 700 "$qa_root/home/runtime"
          cp scripts/native_release_smoke.py "$qa_root/harness.py"
          cp target/release/examples/qa_fixture "$qa_root/verify-fixture"
          python3 - "$RUNNER_TEMP/amberize-qa/archive.sqlite3" "$qa_root/home/archive.sqlite3" <<'PY'
          import sqlite3,sys
          from contextlib import closing
          with closing(sqlite3.connect(sys.argv[1])) as source, closing(sqlite3.connect(sys.argv[2])) as destination:
              source.backup(destination)
          PY
          sudo chown -R amberize-qa-user:amberize-qa-user "$qa_root/home"
          sudo -u amberize-qa-user env HOME="$qa_root/home" GITHUB_ACTIONS=true XDG_RUNTIME_DIR="$qa_root/home/runtime" \
            xvfb-run -a dbus-run-session -- python3 "$qa_root/harness.py" \
            --binary "$qa_root/app/AppRun" --fixture "$qa_root/home/archive.sqlite3" \
            --config-dir "$qa_root/home/profile/com.amberize.app" --report "$qa_root/home/unrelated-user.json" \
            --trace "$qa_root/home/unrelated-user.trace"
          sudo -u amberize-qa-user "$qa_root/verify-fixture" verify "$qa_root/home/archive.sqlite3" > "$RUNNER_TEMP/amberize-qa/unrelated-user-after.json"
          cp "$qa_root/home/unrelated-user.json" "$RUNNER_TEMP/amberize-qa/appimage-unrelated-user.json"
          cp "$qa_root/home/unrelated-user.log" "$RUNNER_TEMP/amberize-qa/appimage-unrelated-user.log"
          python3 - "$qa_root/app" "$RUNNER_TEMP/amberize-qa" <<'PY'
          import json,pwd,sys
          from pathlib import Path
          root = Path(sys.argv[2])
          before = json.loads((root/'before.json').read_text())
          for name in ('after.json','unrelated-user-after.json'):
              after = json.loads((root/name).read_text())
              assert after['integrity']['ok'] and after['mime_hashes'] == before['mime_hashes']
              assert after['proof']['message_blobs_count'] == before['proof']['message_blobs_count'] == 1024
          report = root/'appimage-permissions.json'
          result = json.loads(report.read_text())
          launcher = (Path(sys.argv[1])/'AppRun.wrapped').stat()
          uid = pwd.getpwnam('amberize-qa-user').pw_uid
          assert launcher.st_uid == 0 and uid != 0
          result.update(launcher_owner_uid=0,execution_uid=uid,native_recovery_passed=True,all_1024_hashes_preserved=True,full_integrity_passed=True)
          report.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Verify AppImage recovery as the build user
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/amberize-runtime"
          xvfb-run -a dbus-run-session -- python3 scripts/native_release_smoke.py --binary "$RUNNER_TEMP/amberize-appimage/AppRun" --fixture "$RUNNER_TEMP/amberize-qa/archive.sqlite3" --config-dir "$RUNNER_TEMP/appimage-profile/com.amberize.app" --report "$RUNNER_TEMP/amberize-qa/appimage-native.json" --trace "$RUNNER_TEMP/amberize-qa/appimage-native.trace"
          cargo run -p email_archiver_storage --release --example qa_fixture --locked -- verify "$RUNNER_TEMP/amberize-qa/archive.sqlite3" > "$RUNNER_TEMP/amberize-qa/after.json"
      - name: Upload exact package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-linux-v0.2.5
          path: |
            ${{ runner.temp }}/amberize-qa/*.json
            ${{ runner.temp }}/amberize-qa/*.log
            ${{ runner.temp }}/amberize-qa/*.trace
          if-no-files-found: error
