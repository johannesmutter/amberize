name: Candidate credential persistence QA

on:
  push:
    branches: [codex/pre-release-qa-20260930]
    paths: [.github/workflows/credential-qa.yml]

permissions:
  contents: read

jobs:
  persistence:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Build exact candidate credential adapter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'v0.2.4-8^{}')" = b455497f7a2ffed210008a5dd6375b7cf67cedc4
          python - <<'PYCODE'
          import io,os,pathlib,subprocess,tarfile
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'amberize-credential-source'
          assert not destination.exists()
          destination.mkdir()
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['git','archive','v0.2.4-8']))) as archive:
              archive.extractall(destination,filter='data')
          PYCODE
          cd "$RUNNER_TEMP/amberize-credential-source"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build -p email_archiver_adapters --release --example qa_keychain --locked
      - name: Install fresh Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnome-keyring dbus-x11
      - name: Exercise Windows Credential Manager across separate processes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (Test-Path (Join-Path $env:APPDATA 'com.amberize.app')) { throw 'Unexpected application profile' }
          $reference='qa/'+[guid]::NewGuid().ToString()
          $tool='target/release/examples/qa_keychain.exe'
          & $tool write $reference
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic write failed' }
          try {
            & $tool read $reference
            if ($LASTEXITCODE -ne 0) { throw 'Credential lost across processes' }
            $report=@{passed=$true;candidate_commit='b455497f7a2ffed210008a5dd6375b7cf67cedc4';store='Windows Credential Manager';separate_writer_reader_processes=$true;credential_values_recorded=$false;synthetic_only=$true}
          } finally {
            & $tool delete $reference
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic cleanup failed' }
          }
          $report.synthetic_credential_deleted=$true
          $report|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'credential-persistence.json')
      - name: Exercise persistent Linux Secret Service across separate processes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$HOME/.config/com.amberize.app"
          dbus-run-session -- bash <<'SH'
          set -euo pipefail
          printf '%s' 'amberize-disposable-qa-keyring' | gnome-keyring-daemon --unlock --components=secrets > "$RUNNER_TEMP/keyring-start.log"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,uuid
          tool=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'target/release/examples/qa_keychain'
          reference='qa/'+str(uuid.uuid4())
          subprocess.run([str(tool),'write',reference],check=True)
          try:
              subprocess.run([str(tool),'read',reference],check=True)
          finally:
              subprocess.run([str(tool),'delete',reference],check=True)
          report={'passed':True,'candidate_commit':'b455497f7a2ffed210008a5dd6375b7cf67cedc4','store':'Persistent Linux Secret Service','separate_writer_reader_processes':True,'credential_values_recorded':False,'synthetic_only':True,'synthetic_credential_deleted':True}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'credential-persistence.json').write_text(json.dumps(report,indent=2))
          PY
          SH
      - name: Upload credential-store proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-persistence-${{ runner.os }}
          path: ${{ runner.temp }}/credential-persistence.json
          if-no-files-found: warn
