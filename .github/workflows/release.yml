name: Release

on:
  push:
    tags: ["v*"]
    branches: [codex/pre-release-qa-20260930]
    paths:
      - .github/workflows/release.yml
      - scripts/notarize_macos_dmgs.py
      - scripts/staging_updater_smoke.py
      - scripts/staging_updater_probe.rs
      - scripts/staging_updater_old_fixture.rs
      - scripts/linux_reboot_qa.py
      - scripts/nonmac_updater_smoke.py
      - scripts/nonmac_updater_probe.rs

# Needed so the workflow can create a draft GitHub Release
# and upload assets via the `GITHUB_TOKEN`.
permissions:
  contents: write

# Only allow one release build at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            bundles: "app,dmg"
          - target: x86_64-apple-darwin
            runner: macos-latest
            bundles: "app,dmg"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundles: "msi"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            bundles: "appimage,deb"

    runs-on: ${{ matrix.runner }}

    # Read secrets into env vars so we can safely check them in `if:`
    # (GitHub's workflow validator can reject `secrets.*` inside `if:` expressions).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Require release signing configuration
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATER_KEY" || { echo "::error::Updater signing key is required"; exit 1; }
          if [ "${{ runner.os }}" = "macOS" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              test -n "${!name}" || { echo "::error::Missing macOS signing/notarization setting: $name"; exit 1; }
            done
          fi

      - name: Validate Apple notarization credentials before building
        if: runner.os == 'macOS'
        run: python3 scripts/check_notarization_auth.py --report "$RUNNER_TEMP/amberize-qa/notarization-authentication.json"

      - name: Build Tauri app (macOS signed + notarized)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        uses: tauri-apps/tauri-action@79c624843491f12ae9d63592534ed49df3bc4adb # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: "Amberize ${{ github.ref_name }}"
          releaseBody: |
            See the full changelog in the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          includeRelease: true

      - name: Build Tauri app
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@79c624843491f12ae9d63592534ed49df3bc4adb # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: "Amberize ${{ github.ref_name }}"
          releaseBody: |
            See the full changelog in the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          includeRelease: true

      - name: Verify AppImage metadata (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=("$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/bundle/appimage/"*.AppImage)
          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "::error::No AppImage was built"
            exit 1
          fi
          extraction_dir=$(mktemp -d)
          trap 'rm -rf "$extraction_dir"' EXIT
          for appimage in "${appimages[@]}"; do
            (
              cd "$extraction_dir"
              "$appimage" --appimage-extract > /dev/null
              appdir="$extraction_dir/squashfs-root"
              desktop_files=("$appdir/"*.desktop)
              if [ "${#desktop_files[@]}" -ne 1 ]; then
                echo "::error::AppImage must contain exactly one root desktop file"
                exit 1
              fi
              for metadata in "$appdir/.DirIcon" "${desktop_files[0]}"; do
                if [ ! -s "$metadata" ]; then
                  echo "::error::Missing or broken AppImage metadata: $metadata"
                  exit 1
                fi
                case "$(realpath "$metadata")" in
                  "$appdir/"*) ;;
                  *) echo "::error::AppImage metadata points outside the package: $metadata"; exit 1 ;;
                esac
              done
              if [ ! -x "$appdir/AppRun" ]; then
                echo "::error::AppImage is missing an executable AppRun"
                exit 1
              fi
            )
            rm -rf "$extraction_dir/squashfs-root"
          done

      - name: Notarize and verify macOS disk images
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          folder="target/${{ matrix.target }}/release/bundle/dmg"
          python3 scripts/notarize_macos_dmgs.py --directory "$folder" --report-dir "$RUNNER_TEMP/amberize-qa"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true || { echo "::error::Refusing to replace assets on a published release"; exit 1; }
          for dmg in "$folder/"*.dmg; do
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          done

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/Amberize.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Install release package and test native restart recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amberize-qa"
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "${{ runner.os }}" = macOS ] && [ "$host" != "${{ matrix.target }}" ]; then
            echo "Cross-compiled macOS package: signature checked; native execution requires matching hardware."
            exit 0
          fi
          cargo run -p email_archiver_storage --release --target "${{ matrix.target }}" --example qa_fixture --locked -- create "$RUNNER_TEMP/amberize-qa/archive.sqlite3" 1024 > "$RUNNER_TEMP/amberize-qa/before.json"
          if [ "${{ runner.os }}" = Linux ]; then
            sudo apt-get install -y xvfb
            sudo dpkg -i target/${{ matrix.target }}/release/bundle/deb/*.deb
            binary=$(command -v Amberize || command -v amberize)
            dbus-run-session -- xvfb-run -a python3 scripts/native_release_smoke.py --binary "$binary" --fixture "$RUNNER_TEMP/amberize-qa/archive.sqlite3" --config-dir "$RUNNER_TEMP/amberize-profile/com.amberize.app" --report "$RUNNER_TEMP/amberize-qa/native.json"
            appimage=$(find "target/${{ matrix.target }}/release/bundle/appimage" -name '*.AppImage' -print -quit)
            mkdir "$RUNNER_TEMP/amberize-appimage"
            (cd "$RUNNER_TEMP/amberize-appimage" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
            dbus-run-session -- xvfb-run -a python3 scripts/native_release_smoke.py --binary "$RUNNER_TEMP/amberize-appimage/squashfs-root/AppRun" --fixture "$RUNNER_TEMP/amberize-qa/archive.sqlite3" --config-dir "$RUNNER_TEMP/amberize-appimage-profile/com.amberize.app" --report "$RUNNER_TEMP/amberize-qa/appimage-native.json"
          elif [ "${{ runner.os }}" = Windows ]; then
            powershell -NoProfile -File scripts/install_windows_qa.ps1
          else
            python3 scripts/native_release_smoke.py --binary "$PWD/target/${{ matrix.target }}/release/bundle/macos/Amberize.app/Contents/MacOS/Amberize" --fixture "$RUNNER_TEMP/amberize-qa/archive.sqlite3" --config-dir "$HOME/Library/Application Support/com.amberize.app" --report "$RUNNER_TEMP/amberize-qa/native.json"
          fi
          cargo run -p email_archiver_storage --release --target "${{ matrix.target }}" --example qa_fixture --locked -- verify "$RUNNER_TEMP/amberize-qa/archive.sqlite3" > "$RUNNER_TEMP/amberize-qa/after.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"amberize-qa"; a=json.loads((p/"before.json").read_text()); b=json.loads((p/"after.json").read_text()); assert a["mime_hashes"] == b["mime_hashes"]; assert a["proof"]["message_blobs_count"] == b["proof"]["message_blobs_count"]; print("All synthetic MIME hashes and message counts preserved")'

      - name: Upload native release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qa-${{ matrix.target }}
          path: ${{ runner.temp }}/amberize-qa/
          if-no-files-found: warn

  repair-candidate-dmgs:
    if: github.ref == 'refs/heads/codex/pre-release-qa-20260930' && contains(github.event.head_commit.message, '[qa-dmg-repair]')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            file: Amberize_0.2.4-6_aarch64.dmg
            sha256: 96ebb73255c7d8e1363385e5e0cb60e4e91a287c23fc9d3e33057c7873c35c2c
          - target: x86_64-apple-darwin
            file: Amberize_0.2.4-6_x64.dmg
            sha256: 862b5f9522d4831125150011271b0285568daac5b26f5b9fe6c965bd618aa094
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      QA_TARGET: ${{ matrix.target }}
      QA_FILE: ${{ matrix.file }}
      QA_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify Apple authorization
        run: python3 scripts/check_notarization_auth.py --report "$RUNNER_TEMP/amberize-dmg-evidence/${{ matrix.target }}/authentication.json"
      - name: Download the exact existing draft DMG
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/amberize-dmg/${{ matrix.target }}"
          mkdir -p "$folder"
          gh release view v0.2.4-6 --json tagName,isDraft,isPrerelease,targetCommitish > "$RUNNER_TEMP/amberize-dmg-evidence/${{ matrix.target }}/candidate.json"
          gh release download v0.2.4-6 --pattern "$QA_FILE" --dir "$folder"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          release = json.loads((root / 'amberize-dmg-evidence' / os.environ['QA_TARGET'] / 'candidate.json').read_text())
          assert release['tagName'] == 'v0.2.4-6' and release['isDraft'] and release['isPrerelease']
          assert release['targetCommitish'] == '676f4736adb877cd29cb413c40e3c2ff908c1523'
          path = root / 'amberize-dmg' / os.environ['QA_TARGET'] / os.environ['QA_FILE']
          assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ['QA_SHA256'], 'DMG differs from the tested candidate'
          PY
      - name: Notarize, staple, and assess the DMG container
        run: python3 scripts/notarize_macos_dmgs.py --directory "$RUNNER_TEMP/amberize-dmg/${{ matrix.target }}" --report-dir "$RUNNER_TEMP/amberize-dmg-evidence/${{ matrix.target }}"
      - name: Replace only the verified draft DMG
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v0.2.4-6 --json isDraft --jq '.isDraft')" = true || { echo "::error::Refusing to modify a published release"; exit 1; }
          path="$RUNNER_TEMP/amberize-dmg/${{ matrix.target }}/$QA_FILE"
          gh release upload v0.2.4-6 "$path" --clobber
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          path = root / 'amberize-dmg' / os.environ['QA_TARGET'] / os.environ['QA_FILE']
          report = {'file': path.name, 'before_sha256': os.environ['QA_SHA256'], 'after_sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'draft_only': True}
          (root / 'amberize-dmg-evidence' / os.environ['QA_TARGET'] / 'final-hash.json').write_text(json.dumps(report, indent=2))
          PY
      - name: Upload DMG notarization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmg-notarization-${{ matrix.target }}
          path: ${{ runner.temp }}/amberize-dmg-evidence/${{ matrix.target }}/
          if-no-files-found: error

  staging-updater:
    if: github.ref == 'refs/heads/codex/pre-release-qa-20260930' && contains(github.event.head_commit.message, '[qa-updater]')
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Download exact signed draft and verify staging inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/amberize-updater-inputs"
          gh release view v0.2.4-9 --json tagName,isDraft,isPrerelease,targetCommitish > "$RUNNER_TEMP/amberize-updater-inputs/candidate.json"
          gh release download v0.2.4-9 --pattern Amberize_aarch64.app.tar.gz --pattern latest.json --dir "$RUNNER_TEMP/amberize-updater-inputs"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'amberize-updater-inputs'
          release = json.loads((root / 'candidate.json').read_text())
          assert release['isDraft'] and release['isPrerelease'] and release['tagName'] == 'v0.2.4-9'
          assert release['targetCommitish'] == '9efb01e4e804663b0d9f880fd0d558eed0a29ca1'
          assert subprocess.check_output(['git','rev-parse','v0.2.4-9^{}'],text=True).strip() == release['targetCommitish']
          assert subprocess.check_output(['git','rev-parse','v0.2.3'],text=True).strip() == '12df2be7fd5d16f03445ecdcf9d31a057f405e6b'
          old = json.loads(subprocess.check_output(['git','show','v0.2.3:apps/desktop/src-tauri/tauri.conf.json']))
          candidate = json.loads(subprocess.check_output(['git','show','v0.2.4-9:apps/desktop/src-tauri/tauri.conf.json']))
          assert old['plugins']['updater']['pubkey'] == candidate['plugins']['updater']['pubkey']
          assert hashlib.sha256((root / 'Amberize_aarch64.app.tar.gz').read_bytes()).hexdigest() == '8e063dd2b51c8614d428e72f98c0844f85532a63a0cedba14202451d9fe08033'
          PY
      - name: Export and instrument the older source without changing its UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/amberize-updater-old"
          git archive v0.2.3 | tar -x -C "$RUNNER_TEMP/amberize-updater-old"
          python3 scripts/staging_updater_smoke.py prepare "$RUNNER_TEMP/amberize-updater-old"
      - name: Build isolated older app and synthetic archive helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p email_archiver_storage --release --example qa_fixture --locked
          cd "$RUNNER_TEMP/amberize-updater-old"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build -p email_archiver_storage --release --example qa_updater_old_fixture --locked
          cd "$RUNNER_TEMP/amberize-updater-old/apps/desktop"
          npm ci
      - name: Build and sign isolated older app
        uses: tauri-apps/tauri-action@79c624843491f12ae9d63592534ed49df3bc4adb # v0
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ${{ runner.temp }}/amberize-updater-old/apps/desktop
          tauriScript: npx tauri
          args: --bundles app -- --locked
          includeUpdaterJson: false
          # No tagName/releaseId: build only, with no asset uploads/publication.
      - name: Exercise rejected package, interrupted download, install, restart and Keychain access
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging_updater_smoke.py run \
            --root "$RUNNER_TEMP/amberize-updater-evidence" \
            --old-app "$GITHUB_WORKSPACE/target/release/bundle/macos/Amberize.app" \
            --candidate "$RUNNER_TEMP/amberize-updater-inputs/Amberize_aarch64.app.tar.gz" \
            --manifest "$RUNNER_TEMP/amberize-updater-inputs/latest.json" \
            --fixture-tool "$GITHUB_WORKSPACE/target/release/examples/qa_fixture" \
            --old-fixture-tool "$GITHUB_WORKSPACE/target/release/examples/qa_updater_old_fixture" \
            --candidate-sha256 8e063dd2b51c8614d428e72f98c0844f85532a63a0cedba14202451d9fe08033 \
            --candidate-binary-sha256 80f812c2e53a17d5a79c3931924b2ec77d2576b24ca527d1cc7b8664760416f2
      - name: Upload staging upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-updater-macos
          path: |
            ${{ runner.temp }}/amberize-updater-evidence/
            ${{ runner.temp }}/amberize-updater-inputs/candidate.json
          if-no-files-found: warn

  linux-reboot:
    if: github.ref == 'refs/heads/codex/pre-release-qa-20260930' && contains(github.event.head_commit.message, '[qa-linux-reboot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Cache Cargo registry and fixture build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Install disposable VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 cloud-image-utils ovmf acl
          if [ -c /dev/kvm ]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
      - name: Download verified draft package and Ubuntu guest image
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/amberize-reboot-inputs"
          gh release view v0.2.4-9 --json tagName,isDraft,isPrerelease,targetCommitish > "$RUNNER_TEMP/amberize-reboot-inputs/candidate.json"
          gh release download v0.2.4-9 --pattern Amberize_0.2.4-9_amd64.deb --dir "$RUNNER_TEMP/amberize-reboot-inputs"
          curl -fL --retry 3 https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img -o "$RUNNER_TEMP/amberize-reboot-inputs/ubuntu.img"
          curl -fL --retry 3 https://cloud-images.ubuntu.com/noble/current/SHA256SUMS -o "$RUNNER_TEMP/amberize-reboot-inputs/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'amberize-reboot-inputs'
          release=json.loads((root/'candidate.json').read_text())
          assert release['isDraft'] and release['isPrerelease'] and release['tagName']=='v0.2.4-9'
          assert release['targetCommitish']=='9efb01e4e804663b0d9f880fd0d558eed0a29ca1'
          assert hashlib.sha256((root/'Amberize_0.2.4-9_amd64.deb').read_bytes()).hexdigest()=='72c74d7d43cf992bc2f0f92e3b61a69ff8ac46a8c1fae118a8418787d4d3b399'
          expected=[line.split()[0] for line in (root/'SHA256SUMS').read_text().splitlines() if line.split()[-1].lstrip('*')=='noble-server-cloudimg-amd64.img']
          assert len(expected)==1
          with (root/'ubuntu.img').open('rb') as image:
           actual=hashlib.file_digest(image,'sha256').hexdigest()
          assert actual==expected[0]
          (root/'image-verification.json').write_text(json.dumps({'source':'https://cloud-images.ubuntu.com/noble/current/','sha256':actual,'matches_official_sha256':True}))
          PY
      - name: Build synthetic archive helper
        run: cargo build -p email_archiver_storage --release --example qa_fixture --locked
      - name: Boot guest desktop, reboot guest OS, and verify background restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/linux_reboot_qa.py \
            --root "$RUNNER_TEMP/amberize-reboot-vm" \
            --image "$RUNNER_TEMP/amberize-reboot-inputs/ubuntu.img" \
            --package "$RUNNER_TEMP/amberize-reboot-inputs/Amberize_0.2.4-9_amd64.deb" \
            --fixture-tool "$GITHUB_WORKSPACE/target/release/examples/qa_fixture" \
            --package-sha256 72c74d7d43cf992bc2f0f92e3b61a69ff8ac46a8c1fae118a8418787d4d3b399
      - name: Upload reboot and desktop-login evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-reboot-login
          path: |
            ${{ runner.temp }}/amberize-reboot-vm/evidence/
            ${{ runner.temp }}/amberize-reboot-inputs/candidate.json
            ${{ runner.temp }}/amberize-reboot-inputs/image-verification.json
          if-no-files-found: warn

  intel-native:
    if: github.ref == 'refs/heads/codex/pre-release-qa-20260930' && contains(github.event.head_commit.message, '[qa-intel]')
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Require matching Intel hardware and exact unpublished package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir "$RUNNER_TEMP/amberize-intel-inputs" "$RUNNER_TEMP/amberize-intel-evidence"
          gh release view v0.2.4-9 --json tagName,isDraft,isPrerelease,targetCommitish > "$RUNNER_TEMP/amberize-intel-inputs/candidate.json"
          gh release download v0.2.4-9 --pattern Amberize_x64.app.tar.gz --dir "$RUNNER_TEMP/amberize-intel-inputs"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'amberize-intel-inputs'
          r=json.loads((root/'candidate.json').read_text())
          assert r['tagName']=='v0.2.4-9' and r['isDraft'] and r['isPrerelease']
          assert r['targetCommitish']=='9efb01e4e804663b0d9f880fd0d558eed0a29ca1'
          assert hashlib.sha256((root/'Amberize_x64.app.tar.gz').read_bytes()).hexdigest()=='285802d9e1a33bfe5beb7e01e513ddead95c42d6df7b7e74f6e13831c7350b2a'
          PY
          tar -xzf "$RUNNER_TEMP/amberize-intel-inputs/Amberize_x64.app.tar.gz" -C "$RUNNER_TEMP/amberize-intel-inputs"
          app="$RUNNER_TEMP/amberize-intel-inputs/Amberize.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Run native Intel archive restoration and recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p email_archiver_storage --release --example qa_fixture --locked
          fixture="$RUNNER_TEMP/amberize-intel-evidence/archive.sqlite3"
          target/release/examples/qa_fixture create "$fixture" 1024 > "$RUNNER_TEMP/amberize-intel-evidence/before.json"
          python3 scripts/native_release_smoke.py --binary "$RUNNER_TEMP/amberize-intel-inputs/Amberize.app/Contents/MacOS/Amberize" --fixture "$fixture" --config-dir "$HOME/Library/Application Support/com.amberize.app" --report "$RUNNER_TEMP/amberize-intel-evidence/native.json"
          target/release/examples/qa_fixture verify "$fixture" > "$RUNNER_TEMP/amberize-intel-evidence/after.json"
          python3 - <<'PY'
          import json,os,pathlib,platform
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'amberize-intel-evidence'
          a=json.loads((root/'before.json').read_text());b=json.loads((root/'after.json').read_text());n=json.loads((root/'native.json').read_text())
          assert platform.machine()=='x86_64' and n['passed'] and len(n['stages'])==5
          assert n['binary_sha256']=='9b069f6cf837c0e45429a98997fca477f3f838680d41a7933424e17985d983be'
          assert a['mime_hashes']==b['mime_hashes'] and b['integrity']['ok']
          (root/'hardware.json').write_text(json.dumps({'machine':platform.machine(),'os':platform.platform(),'exact_candidate_binary':True,'full_integrity_passed':True,'all_1024_hashes_preserved':True}))
          PY
      - name: Upload native Intel proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate9-intel-native
          path: |
            ${{ runner.temp }}/amberize-intel-evidence/
            ${{ runner.temp }}/amberize-intel-inputs/candidate.json
          if-no-files-found: warn

  nonmac-updater:
    if: github.ref == 'refs/heads/codex/pre-release-qa-20260930' && contains(github.event.head_commit.message, '[qa-nonmac-updater]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            payload: Amberize_0.2.4-9_x64_en-US.msi.zip
            payload_sha256: 39e46ebf7e73f611d8669dad8f29ab9c647cc27e1cb1da1eb4c3fc80d8f9a047
            installed_sha256: a0c07b161d81d7993bc3783015d2b6aed2950cd1d520a17f92c33e8c07ead927
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            payload: Amberize_0.2.4-9_amd64.AppImage.tar.gz
            payload_sha256: 6e7810be3fd62110751e5982c083ce836b7e450cdba41951d3db199d5a4eaec7
            installed_sha256: eb0b254ac0dae6543e6dd7cd02e1baf40a060de95b927313122d6b46323c00aa
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QA_PAYLOAD: ${{ matrix.payload }}
      QA_PAYLOAD_SHA256: ${{ matrix.payload_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Cache Rust builds
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Verify exact draft and prepare old source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/amberize-nonmac-inputs" "$RUNNER_TEMP/amberize-nonmac-old"
          gh release view v0.2.4-9 --json tagName,isDraft,isPrerelease,targetCommitish > "$RUNNER_TEMP/amberize-nonmac-inputs/candidate.json"
          gh release download v0.2.4-9 --pattern "$QA_PAYLOAD" --pattern latest.json --dir "$RUNNER_TEMP/amberize-nonmac-inputs"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'amberize-nonmac-inputs'
          r=json.loads((root/'candidate.json').read_text())
          assert r['isDraft'] and r['isPrerelease'] and r['tagName']=='v0.2.4-9'
          assert r['targetCommitish']=='9efb01e4e804663b0d9f880fd0d558eed0a29ca1'
          assert subprocess.check_output(['git','rev-parse','v0.2.4-9^{}'],text=True).strip()==r['targetCommitish']
          assert hashlib.sha256((root/os.environ['QA_PAYLOAD']).read_bytes()).hexdigest()==os.environ['QA_PAYLOAD_SHA256']
          PY
          python - <<'PYCODE'
          import io,os,pathlib,subprocess,tarfile
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'amberize-nonmac-old'
          assert destination.is_dir() and not any(destination.iterdir())
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['git','archive','v0.2.3']))) as archive:
              archive.extractall(destination,filter='data')
          PYCODE
          python scripts/nonmac_updater_smoke.py prepare "$RUNNER_TEMP/amberize-nonmac-old"
          cargo build -p email_archiver_storage --release --example qa_fixture --locked
          cargo build -p email_archiver_adapters --release --example qa_keychain --locked
          cd "$RUNNER_TEMP/amberize-nonmac-old"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build -p email_archiver_storage --release --example qa_updater_old_fixture --locked
          cd apps/desktop
          npm ci
      - name: Build older isolated installer
        uses: tauri-apps/tauri-action@79c624843491f12ae9d63592534ed49df3bc4adb # v0
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        with:
          projectPath: ${{ runner.temp }}/amberize-nonmac-old/apps/desktop
          tauriScript: npx tauri
          args: --bundles ${{ matrix.bundles }} -- --locked
          includeUpdaterJson: false
      - name: Install older MSI and test actual updater
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $inputRoot=Join-Path $env:RUNNER_TEMP 'amberize-nonmac-inputs'
          $msi=@(Get-ChildItem 'target/release/bundle/msi/*.msi')
          if ($msi.Count -ne 1) { throw 'Expected one old installer' }
          $log=Join-Path $inputRoot 'old-install.log'
          $install=Start-Process msiexec.exe -ArgumentList @('/i', ('"'+$msi[0].FullName+'"'), '/qn', '/norestart', '/l*v', ('"'+$log+'"')) -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "Old install failed: $($install.ExitCode)" }
          $binary=Join-Path $env:ProgramFiles 'Amberize/Amberize.exe'
          if (-not (Test-Path $binary)) { throw 'Installed older binary missing' }
          python scripts/nonmac_updater_smoke.py run --root (Join-Path $env:RUNNER_TEMP 'amberize-nonmac-evidence') --old-binary $binary --candidate (Join-Path $inputRoot '${{ matrix.payload }}') --manifest (Join-Path $inputRoot 'latest.json') --fixture-tool 'target/release/examples/qa_fixture.exe' --old-fixture-tool 'target/release/examples/qa_updater_old_fixture.exe' --credential-tool 'target/release/examples/qa_keychain.exe' --candidate-sha256 '${{ matrix.payload_sha256 }}' --candidate-binary-sha256 '${{ matrix.installed_sha256 }}'
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows updater QA failed' }
      - name: Run older AppImage and test actual updater
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/amberize-nonmac-inputs"
          cp target/release/bundle/appimage/*.AppImage "$input/Amberize-0.2.3.AppImage"
          chmod +x "$input/Amberize-0.2.3.AppImage"
          dbus-run-session -- xvfb-run -a python3 scripts/nonmac_updater_smoke.py run --root "$RUNNER_TEMP/amberize-nonmac-evidence" --old-binary "$input/Amberize-0.2.3.AppImage" --candidate "$input/${{ matrix.payload }}" --manifest "$input/latest.json" --fixture-tool "$GITHUB_WORKSPACE/target/release/examples/qa_fixture" --old-fixture-tool "$GITHUB_WORKSPACE/target/release/examples/qa_updater_old_fixture" --candidate-sha256 '${{ matrix.payload_sha256 }}' --candidate-binary-sha256 '${{ matrix.installed_sha256 }}'
      - name: Upload platform updater evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate9-updater-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/amberize-nonmac-evidence/
            ${{ runner.temp }}/amberize-nonmac-inputs/candidate.json
            ${{ runner.temp }}/amberize-nonmac-inputs/old-install.log
          if-no-files-found: warn
