name: Release

on:
  push:
    tags: ["v*"]

# Needed so the workflow can create a draft GitHub Release
# and upload assets via the `GITHUB_TOKEN`.
permissions:
  contents: write

# Only allow one release build at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            bundles: "app,dmg"
          - target: x86_64-apple-darwin
            runner: macos-latest
            bundles: "app,dmg"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundles: "msi"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            bundles: "appimage,deb"

    runs-on: ${{ matrix.runner }}

    # Read secrets into env vars so we can safely check them in `if:`
    # (GitHub's workflow validator can reject `secrets.*` inside `if:` expressions).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Require release signing configuration
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATER_KEY" || { echo "::error::Updater signing key is required"; exit 1; }
          if [ "${{ runner.os }}" = "macOS" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              test -n "${!name}" || { echo "::error::Missing macOS signing/notarization setting: $name"; exit 1; }
            done
          fi

      - name: Validate Apple notarization credentials before building
        if: runner.os == 'macOS'
        run: python3 scripts/check_notarization_auth.py --report "$RUNNER_TEMP/amberize-qa/notarization-authentication.json"

      - name: Build Tauri app (macOS signed + notarized)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        uses: tauri-apps/tauri-action@79c624843491f12ae9d63592534ed49df3bc4adb # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: "Amberize ${{ github.ref_name }}"
          releaseBody: |
            See the full changelog in the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          includeRelease: true

      - name: Build Tauri app
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@79c624843491f12ae9d63592534ed49df3bc4adb # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: "Amberize ${{ github.ref_name }}"
          releaseBody: |
            See the full changelog in the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          includeRelease: true

      - name: Verify AppImage metadata (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=("$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/bundle/appimage/"*.AppImage)
          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "::error::No AppImage was built"
            exit 1
          fi
          extraction_dir=$(mktemp -d)
          trap 'rm -rf "$extraction_dir"' EXIT
          for appimage in "${appimages[@]}"; do
            (
              cd "$extraction_dir"
              python3 "$GITHUB_WORKSPACE/scripts/extract_appimage.py" "$appimage" "$extraction_dir/squashfs-root" > /dev/null
              appdir="$extraction_dir/squashfs-root"
              desktop_files=("$appdir/"*.desktop)
              if [ "${#desktop_files[@]}" -ne 1 ]; then
                echo "::error::AppImage must contain exactly one root desktop file"
                exit 1
              fi
              for metadata in "$appdir/.DirIcon" "${desktop_files[0]}"; do
                if [ ! -s "$metadata" ]; then
                  echo "::error::Missing or broken AppImage metadata: $metadata"
                  exit 1
                fi
                case "$(realpath "$metadata")" in
                  "$appdir/"*) ;;
                  *) echo "::error::AppImage metadata points outside the package: $metadata"; exit 1 ;;
                esac
              done
              if [ ! -x "$appdir/AppRun" ]; then
                echo "::error::AppImage is missing an executable AppRun"
                exit 1
              fi
              python3 "$GITHUB_WORKSPACE/scripts/verify_appimage_permissions.py" "$appdir" --max-glibc 2.35
            )
            rm -rf "$extraction_dir/squashfs-root"
          done

      - name: Notarize and verify macOS disk images
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          folder="target/${{ matrix.target }}/release/bundle/dmg"
          python3 scripts/notarize_macos_dmgs.py --directory "$folder" --report-dir "$RUNNER_TEMP/amberize-qa"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true || { echo "::error::Refusing to replace assets on a published release"; exit 1; }
          for dmg in "$folder/"*.dmg; do
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          done

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/Amberize.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Install release package and test native restart recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amberize-qa"
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "${{ runner.os }}" = macOS ] && [ "$host" != "${{ matrix.target }}" ]; then
            echo "Cross-compiled macOS package: signature checked; native execution requires matching hardware."
            exit 0
          fi
          cargo run -p email_archiver_storage --release --target "${{ matrix.target }}" --example qa_fixture --locked -- create "$RUNNER_TEMP/amberize-qa/archive.sqlite3" 1024 > "$RUNNER_TEMP/amberize-qa/before.json"
          if [ "${{ runner.os }}" = Linux ]; then
            sudo apt-get install -y xvfb
            sudo dpkg -i target/${{ matrix.target }}/release/bundle/deb/*.deb
            binary=$(command -v Amberize || command -v amberize)
            dbus-run-session -- xvfb-run -a python3 scripts/native_release_smoke.py --binary "$binary" --fixture "$RUNNER_TEMP/amberize-qa/archive.sqlite3" --config-dir "$RUNNER_TEMP/amberize-profile/com.amberize.app" --report "$RUNNER_TEMP/amberize-qa/native.json"
            appimage=$(find "target/${{ matrix.target }}/release/bundle/appimage" -name '*.AppImage' -print -quit)
            mkdir "$RUNNER_TEMP/amberize-appimage"
            python3 scripts/extract_appimage.py "$appimage" "$RUNNER_TEMP/amberize-appimage/squashfs-root" > /dev/null
            dbus-run-session -- xvfb-run -a python3 scripts/native_release_smoke.py --binary "$RUNNER_TEMP/amberize-appimage/squashfs-root/AppRun" --fixture "$RUNNER_TEMP/amberize-qa/archive.sqlite3" --config-dir "$RUNNER_TEMP/amberize-appimage-profile/com.amberize.app" --report "$RUNNER_TEMP/amberize-qa/appimage-native.json"
          elif [ "${{ runner.os }}" = Windows ]; then
            powershell -NoProfile -File scripts/install_windows_qa.ps1
          else
            python3 scripts/native_release_smoke.py --binary "$PWD/target/${{ matrix.target }}/release/bundle/macos/Amberize.app/Contents/MacOS/Amberize" --fixture "$RUNNER_TEMP/amberize-qa/archive.sqlite3" --config-dir "$HOME/Library/Application Support/com.amberize.app" --report "$RUNNER_TEMP/amberize-qa/native.json"
          fi
          cargo run -p email_archiver_storage --release --target "${{ matrix.target }}" --example qa_fixture --locked -- verify "$RUNNER_TEMP/amberize-qa/archive.sqlite3" > "$RUNNER_TEMP/amberize-qa/after.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"amberize-qa"; a=json.loads((p/"before.json").read_text()); b=json.loads((p/"after.json").read_text()); assert a["mime_hashes"] == b["mime_hashes"]; assert a["proof"]["message_blobs_count"] == b["proof"]["message_blobs_count"]; print("All synthetic MIME hashes and message counts preserved")'

      - name: Test root-owned AppImage as an unrelated user
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          qa_root=$(mktemp -d /tmp/amberize-appimage-user-XXXXXX)
          trap 'sudo rm -rf "$qa_root"' EXIT
          chmod 755 "$qa_root"
          cp -a "$RUNNER_TEMP/amberize-appimage/squashfs-root" "$qa_root/app"
          sudo chown -hR root:root "$qa_root/app"
          python3 scripts/verify_appimage_permissions.py "$qa_root/app" --max-glibc 2.35 > "$RUNNER_TEMP/amberize-qa/appimage-permissions.json"
          mkdir "$qa_root/home"
          sudo useradd --no-create-home --home-dir "$qa_root/home" --shell /bin/bash amberize-qa-user
          cp scripts/native_release_smoke.py "$qa_root/harness.py"
          python3 - "$RUNNER_TEMP/amberize-qa/archive.sqlite3" "$qa_root/home/archive.sqlite3" <<'PY'
          import sqlite3,sys
          from contextlib import closing
          with closing(sqlite3.connect(sys.argv[1])) as source, closing(sqlite3.connect(sys.argv[2])) as destination:
              source.backup(destination)
          PY
          sudo chown -R amberize-qa-user:amberize-qa-user "$qa_root/home"
          sudo -u amberize-qa-user env HOME="$qa_root/home" GITHUB_ACTIONS=true \
            dbus-run-session -- xvfb-run -a python3 "$qa_root/harness.py" \
            --binary "$qa_root/app/AppRun" --fixture "$qa_root/home/archive.sqlite3" \
            --config-dir "$qa_root/home/profile/com.amberize.app" --report "$qa_root/home/unrelated-user.json"
          cp "$qa_root/home/unrelated-user.json" "$RUNNER_TEMP/amberize-qa/appimage-unrelated-user.json"
          cp "$qa_root/home/unrelated-user.log" "$RUNNER_TEMP/amberize-qa/appimage-unrelated-user.log"
          python3 - "$qa_root/app" "$RUNNER_TEMP/amberize-qa/appimage-permissions.json" <<'PY'
          import json,pwd,sys
          from pathlib import Path
          report = Path(sys.argv[2])
          result = json.loads(report.read_text())
          launcher = (Path(sys.argv[1]) / 'AppRun.wrapped').stat()
          uid = pwd.getpwnam('amberize-qa-user').pw_uid
          assert launcher.st_uid == 0 and uid != 0
          result.update(launcher_owner_uid=launcher.st_uid, execution_uid=uid, native_recovery_passed=True)
          report.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY

      - name: Upload native release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qa-${{ matrix.target }}
          path: ${{ runner.temp }}/amberize-qa/
          if-no-files-found: warn
